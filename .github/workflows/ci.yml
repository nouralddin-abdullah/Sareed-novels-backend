name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Throwaway SQL Server for the integration tests (search, ranking, view tracking, migrations).
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sard_Ci_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Sard_Ci_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Sareed-novels-backend.sln

      - name: Build
        run: dotnet build Sareed-novels-backend.sln --no-restore -c Release

      - name: Test
        env:
          # Test-only container credentials, not a real secret.
          SARD_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Sard_Ci_Passw0rd!;TrustServerCertificate=true
        run: dotnet test Sareed-novels-backend.Tests --no-build -c Release --logger "console;verbosity=normal"
